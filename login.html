<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AttendEase</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-calendar-check"></i>
                <span>AttendEase</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="features.html" class="nav-link">Features</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="login.html" class="nav-link login-btn active">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="login-main">
        <div class="login-container">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your AttendEase account</p>
                </div>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="userType">Login As:</label>
                        <select id="userType" name="userType" required>
                            <option value="">Select User Type</option>
                            <option value="admin">Administrator</option>
                            <option value="teacher">Teacher</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                </form>
                
                <div class="demo-accounts">
                    <h4>Demo Accounts:</h4>
                    <div class="demo-buttons">
                        <button class="btn btn-demo" onclick="fillDemoCredentials('admin')">Admin Demo</button>
                        <button class="btn btn-demo" onclick="fillDemoCredentials('teacher')">Teacher Demo</button>
                        <button class="btn btn-demo" onclick="fillDemoCredentials('student')">Student Demo</button>
                    </div>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #7f8c8d;">
                        <i class="fas fa-info-circle"></i>
                        Use demo accounts to explore different user roles and permissions
                    </p>
                </div>
                
                <div class="quick-test-link">
                    <p><a href="quick-test.html">🧪 Quick Test All Accounts</a></p>
                </div>
                
                <div class="signup-link">
                    <p>Don't have an account? <a href="register.html">Sign up here</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/database.js"></script>
    <script>
        // Demo credentials helper
        function fillDemoCredentials(type) {
            const credentials = {
                admin: { username: "admin", password: "admin123", userType: "admin" },
                teacher: { username: "teacher1", password: "teacher123", userType: "teacher" },
                student: { username: "student1", password: "student123", userType: "student" },
            }

            if (credentials[type]) {
                document.getElementById("userType").value = credentials[type].userType
                document.getElementById("username").value = credentials[type].username
                document.getElementById("password").value = credentials[type].password
                
                // Visual feedback
                showMessage(`${type.charAt(0).toUpperCase() + type.slice(1)} credentials loaded!`, 'success');
            }
        }

        // Auto-fill from quick test
        document.addEventListener('DOMContentLoaded', () => {
            const autoFill = localStorage.getItem('autoFillCredentials');
            if (autoFill) {
                const credentials = JSON.parse(autoFill);
                
                setTimeout(() => {
                    document.getElementById('userType').value = credentials.userType;
                    document.getElementById('username').value = credentials.username;
                    document.getElementById('password').value = credentials.password;
                    
                    if (credentials.fromQuickTest) {
                        showMessage('Credentials auto-filled from quick test!', 'info');
                        // Highlight the sign in button
                        const signInBtn = document.querySelector('button[type="submit"]');
                        signInBtn.style.animation = 'pulse 2s infinite';
                    }
                }, 500);
                
                localStorage.removeItem('autoFillCredentials');
            }
        });

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const username = formData.get('username');
            const password = formData.get('password');
            const userType = formData.get('userType');

            if (!username || !password || !userType) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            // Show loading state
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;

            try {
                // Simulate login process
                const result = await simulateLogin(username, password, userType);

                if (result.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Store successful login
                    localStorage.setItem('userSession', JSON.stringify({
                        user: result.user,
                        timestamp: new Date().getTime()
                    }));
                    
                    // Store test result if from quick test
                    const fromQuickTest = localStorage.getItem('autoFillCredentials');
                    if (fromQuickTest) {
                        localStorage.setItem('testResult', JSON.stringify({
                            accountType: userType,
                            accountName: result.user.fullName,
                            success: true
                        }));
                    }

                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('An error occurred during login', 'error');
                console.error('Login error:', error);
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // Simulate login process
        async function simulateLogin(username, password, userType) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const validCredentials = {
                        admin: { 
                            username: "admin", 
                            password: "admin123", 
                            type: "admin",
                            user: {
                                id: 1,
                                username: "admin",
                                email: "admin@attendease.com",
                                fullName: "System Administrator",
                                role: "admin"
                            }
                        },
                        teacher1: { 
                            username: "teacher1", 
                            password: "teacher123", 
                            type: "teacher",
                            user: {
                                id: 2,
                                username: "teacher1",
                                email: "teacher@attendease.com",
                                fullName: "John Teacher",
                                role: "teacher"
                            }
                        },
                        student1: { 
                            username: "student1", 
                            password: "student123", 
                            type: "student",
                            user: {
                                id: 3,
                                username: "student1",
                                email: "student@attendease.com",
                                fullName: "Jane Student",
                                role: "student"
                            }
                        }
                    };

                    const account = validCredentials[username];
                    const isValid = account && 
                                  account.password === password && 
                                  account.type === userType;

                    if (isValid) {
                        resolve({ success: true, user: account.user });
                    } else {
                        resolve({ success: false, error: 'Invalid credentials or user type' });
                    }
                }, 1000);
            });
        }

        // Message display helper
        function showMessage(message, type = 'info') {
            // Remove existing messages
            const existingMessages = document.querySelectorAll('.auth-message');
            existingMessages.forEach(msg => msg.remove());

            // Create message element
            const messageDiv = document.createElement('div');
            messageDiv.className = `auth-message ${type}`;
            messageDiv.style.cssText = `
                padding: 12px 20px;
                margin: 15px 0;
                border-radius: 5px;
                font-weight: 500;
                text-align: center;
                ${type === 'success' ? 'background: #d5f4e6; color: #27ae60; border: 1px solid #27ae60;' : ''}
                ${type === 'error' ? 'background: #fadbd8; color: #e74c3c; border: 1px solid #e74c3c;' : ''}
                ${type === 'info' ? 'background: #d6eaf8; color: #3498db; border: 1px solid #3498db;' : ''}
            `;
            messageDiv.textContent = message;

            // Insert message
            const form = document.getElementById('loginForm');
            if (form) {
                form.insertBefore(messageDiv, form.firstChild);

                // Auto-remove after 5 seconds
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.remove();
                    }
                }, 5000);
            }
        }

        // Add pulse animation for highlighted button
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.7); }
                70% { box-shadow: 0 0 0 10px rgba(52, 152, 219, 0); }
                100% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
